name: Build and Publish CI Image 🐳

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: >
          Tag of the upstream ghcr.io/insightsengineering/rstudio image to
          build on. Use 'latest' or a date tag like '2026.08.20'.
        required: false
        default: "latest"
        type: string
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: "0 6 * * 0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kpagacz/rstudio

permissions:
  contents: read
  packages: write

jobs:
  # ── Job 1: Build ───────────────────────────────────────────────
  build:
    name: Build image 🔨
    runs-on: ubuntu-latest
    outputs:
      date_tag: ${{ steps.tags.outputs.date_tag }}
      base_tag: ${{ steps.tags.outputs.base_tag }}
      tag_latest: ${{ steps.tags.outputs.tag_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tags
        id: tags
        run: |
          DATE_TAG=$(date +%Y.%m.%d)
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"

          # Resolve the upstream base tag
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BASE_TAG="latest"
          else
            BASE_TAG="${{ inputs.base_tag || 'latest' }}"
          fi
          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"

          # Tag as 'latest' only when building from the upstream 'latest'
          if [ "${BASE_TAG}" = "latest" ]; then
            echo "tag_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BASE_TAG=${{ steps.tags.outputs.base_tag }}
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.date_tag }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ── Job 2: Test ────────────────────────────────────────────────
  test:
    name: Test image 🧪
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Verify installed packages
        run: |
          docker run --rm \
            --user 1000:1000 \
            -v "${{ github.workspace }}/scripts/verify_packages.R:/tmp/verify_packages.R:ro" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.date_tag }}" \
            Rscript /tmp/verify_packages.R

  # ── Job 3: Publish ─────────────────────────────────────────────
  publish:
    name: Publish image 🚀
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image as latest
        if: needs.build.outputs.tag_latest == 'true'
        run: |
          docker tag \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.date_tag }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Push date-tagged image
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.date_tag }}"

      - name: Push latest tag
        if: needs.build.outputs.tag_latest == 'true'
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
